name: Java CI with Maven

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-test-lint:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check RAM Usage
        run: free -h

      - name: Set up JDK 17 
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin' 
          cache: 'maven'

      - name: Build and Test
        working-directory: ./backend
        run: |
          export MAVEN_OPTS="-Xmx512m -XX:+UseSerialGC"
          chmod +x mvnw
          ./mvnw --batch-mode clean install -T 1

      - name: Checkstyle / Lint
        if: success()
        working-directory: ./backend
        run: ./mvnw checkstyle:check
        continue-on-error: true

      - name: Check RAM Usage (After)
        if: always()
        run: free -h