services:
  postgres:
    image: postgres:16-alpine
    container_name: noteapp-postgres
    environment:
      POSTGRES_USER: noteapp
      POSTGRES_PASSWORD: noteapp
      POSTGRES_DB: notes_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noteapp -d notes_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - noteapp-net

  mongo:
    image: mongo:7
    container_name: noteapp-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - noteapp-net

  user-service:
    build:
      context: ./
      dockerfile: backend/apps/user-service/Dockerfile
    container_name: noteapp-user-service
    environment:
      MONGODB_URI: mongodb://mongo:27017/user_service
      PORT: 5001
    ports:
      - "5001:5001"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - noteapp-net

  note-service:
    build:
      context: ./
      dockerfile: backend/apps/note-service/Dockerfile
    container_name: noteapp-note-service
    environment:
      POSTGRES_URI: jdbc:postgresql://postgres:5432/notes_db
      POSTGRES_USER: noteapp
      POSTGRES_PASSWORD: noteapp
      PORT: 5002
    ports:
      - "5002:5002"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - noteapp-net

  file-service:
    build:
      context: ./
      dockerfile: backend/apps/file-service/Dockerfile
    container_name: noteapp-file-service
    environment:
      MONGODB_URI: mongodb://mongo:27017/file_service
      PORT: 5003
    ports:
      - "5003:5003"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - noteapp-net

  gateway:
    build:
      context: ./
      dockerfile: backend/apps/gateway-service/Dockerfile
    container_name: noteapp-gateway
    environment:
      USER_SERVICE_URL: http://user-service:5001
      NOTE_SERVICE_URL: http://note-service:5002
      FILE_SERVICE_URL: http://file-service:5003
      PORT: 5000
    ports:
      - "8080:5000"
    depends_on:
      - user-service
      - note-service
      - file-service
    networks:
      - noteapp-net

volumes:
  pg_data:
  mongo_data:

networks:
  noteapp-net:
    driver: bridge
