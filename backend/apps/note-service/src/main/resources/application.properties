spring.application.name=NoteService
server.port=${PORT:5002}

spring.datasource.url=${POSTGRES_URI:jdbc:postgresql://localhost:5432/notes_db}
spring.datasource.username=${POSTGRES_USER:noteapp}
spring.datasource.password=${POSTGRES_PASSWORD:noteapp}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.continue-on-error=false
